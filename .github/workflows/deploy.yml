name: CI and publish to gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Only write access to repository contents is needed, to update the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # The site is served from /<repository name>, so the base path follows the repo name.
      - name: Build static export
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - name: Check built pages for contact details
        run: node scripts/contact-check.mjs out

      # Publish only from main. The gh-pages branch holds nothing but the build output.
      - name: Publish to gh-pages branch
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +x
          # Without this file, Pages runs Jekyll, which hides the _next folder.
          touch out/.nojekyll
          cd out
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          # Force push keeps the branch as a single commit of the latest build.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
